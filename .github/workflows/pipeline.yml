
name: Product Catalog CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (basic code checks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git show --check --format= HEAD

  test:
    name: Tests automatiques
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and controller tests
        run: bash ./mvnw test

  build:
    name: Construction du JAR
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run integration tests
        run: bash ./mvnw verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-catalog-jar
          path: target/*.jar
          if-no-files-found: error

  deploy:
    name: Déploiement simulé
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: product-catalog-jar
          path: dist/

      - name: Verify artifact
        run: |
          ls -lh dist/
          echo "Déploiement simulé avec succès !"
